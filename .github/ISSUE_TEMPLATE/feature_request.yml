name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the workflow, in your own words. Knowing the "why" helps find the best solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Nova to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you've tried or seen elsewhere?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
