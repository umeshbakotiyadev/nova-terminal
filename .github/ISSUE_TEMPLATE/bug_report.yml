name: Bug report
description: Something in Nova doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please check the open issues first in case it's already known.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new tab
        2. Run `...`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nova version
      description: Settings → About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.1 / Windows 11 24H2"
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - zsh
        - PowerShell 7
        - Windows PowerShell 5.1
        - bash
        - fish
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or anything else
      description: A screenshot or screen recording helps a lot for anything visual. If the problem only happens with your shell config, mention the plugins or prompt you use (oh-my-zsh, starship, oh-my-posh, ...).
